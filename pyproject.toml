[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latin-itn-training"
version = "0.1.0"
description = "Train model for Inverse Text Normalization (casing and punctuation restoration) for Latin ASR outputs"
authors = [{ name = "N. Jand" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=5.2.0",
    "datasets>=2.12.0",
    "evaluate>=0.4.0",
    "scikit-learn>=1.2.0",
    "modal>=0.60.0",
    "huggingface-hub>=0.16.0",
    "wandb>=0.15.0",
    "codecarbon>=2.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "accelerate>=0.26.0",
    "sentencepiece>=0.1.99",
    "protobuf"
]

[project.urls]
Homepage = "https://github.com/njand/latin-asr-postprocess"
Repository = "https://github.com/njand/latin-asr-postprocess"
Issues = "https://github.com/njand/latin-asr-postprocess/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["latin_itn_training*"]

[dependency-groups]
dev = [
    "pytest-mock>=3.15.1",
]
